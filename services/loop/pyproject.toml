[project]
name = "loop"
version = "0.1.0"
description = "LOOP — autonomous product reliability and growth loop"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.8.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pyyaml>=6.0",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]
gcp = [
  "google-cloud-bigquery>=3.27",
  "google-cloud-pubsub>=2.27",
  "google-cloud-modelarmor>=0.3",
  "google-cloud-dlp>=3.27",
  "google-cloud-firestore>=2.19",
  "google-auth>=2.38",
]

[project.scripts]
loop = "loop.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["loop*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
