# Local stack — API + console (optional; prefer ./scripts/boot.sh)

services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      LOOP_HOST: "0.0.0.0"
      LOOP_PORT: "8080"
      LOOP_CONSOLE_ORIGIN: "*"
    ports:
      - "8080:8080"
    command: >
      bash -lc "pip install -q -e services/loop
      && python data/generate.py
      && python -m uvicorn loop.api:app --host 0.0.0.0 --port 8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/office')"]
      interval: 10s
      timeout: 5s
      retries: 12

  console:
    image: node:22-bookworm-slim
    working_dir: /app/apps/console
    volumes:
      - ./:/app
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    command: >
      bash -lc "npm ci
      && ./node_modules/.bin/next dev --hostname 0.0.0.0 --port 3000"
