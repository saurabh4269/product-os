name: deploy-gcp

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-loop
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: mystical-timing-442601-q8

      - name: Package host bundle
        run: |
          unset NEXT_PUBLIC_API_URL LOOP_STATIC
          ./scripts/package-host.sh

      - name: Deploy Cloud Run loop
        env:
          GOOGLE_CLOUD_PROJECT: mystical-timing-442601-q8
          GOOGLE_CLOUD_REGION: us-central1
        run: ./scripts/deploy-gcp.sh
