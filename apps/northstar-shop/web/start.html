<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Start — Northstar</title>
    <link rel="stylesheet" href="./shop.css" />
  </head>
  <body>
    <div class="wrap">
      <nav>
        <a href="./index.html"><strong>Northstar</strong></a>
      </nav>
      <h1>Start a house account</h1>
      <p class="lead">Experiment B said “workspace.” Personal-account people bounced. The OS can put the old line back.</p>
      <button class="btn" id="cta" type="button">…</button>
      <p class="flag" id="flag"></p>
    </div>
    <script type="module">
      import { loadCompany, activationCta } from "./runtime.js";
      const cta = document.getElementById("cta");
      const flag = document.getElementById("flag");
      try {
        const c = await loadCompany();
        cta.textContent = activationCta(c.flags);
        flag.textContent =
          c.flags.onboarding_copy_exp_b === "off"
            ? "Copy experiment B is off. This is the original line."
            : "Variant B is live. Approvals can revert it.";
      } catch {
        cta.textContent = "Continue with workspace";
      }
    </script>
  </body>
</html>
