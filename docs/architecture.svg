<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Product OS five planes">
  <rect width="1200" height="680" fill="#f5f5f7"/>
  <text x="48" y="48" fill="#0071e3" font-family="IBM Plex Mono, monospace" font-size="14" letter-spacing="3">PRODUCT OS</text>
  <text x="48" y="78" fill="#1d1d1f" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="600">Five planes</text>

  <g>
    <rect x="40" y="110" width="220" height="520" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="56" y="142" fill="#0071e3" font-family="IBM Plex Mono, monospace" font-size="12">1 SIGNAL</text>
    <text x="56" y="180" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">GA4 · Ads · PostHog</text>
    <text x="56" y="202" fill="#86868b" font-family="Inter, sans-serif" font-size="13">Firebase · Logging</text>
    <text x="56" y="224" fill="#86868b" font-family="Inter, sans-serif" font-size="13">Voice · Reviews · CRM</text>
    <text x="56" y="270" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14" font-weight="600">BigQuery FACTS</text>
    <text x="56" y="292" fill="#86868b" font-family="Inter, sans-serif" font-size="13">never raw rows ? memory</text>
  </g>

  <g>
    <rect x="280" y="110" width="280" height="520" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="296" y="142" fill="#0071e3" font-family="IBM Plex Mono, monospace" font-size="12">2 AGENT · ADK 2</text>
    <text x="296" y="180" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">Signal ? Investigator</text>
    <text x="296" y="202" fill="#86868b" font-family="Inter, sans-serif" font-size="13">specialists in parallel</text>
    <text x="296" y="240" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">Root cause · Type A / B</text>
    <text x="296" y="274" fill="#c93400" font-family="Inter, sans-serif" font-size="14">BUG ? Code + Test + PR</text>
    <text x="296" y="298" fill="#248a3d" font-family="Inter, sans-serif" font-size="14">FEATURE ? PRD + experiment</text>
    <polygon points="380,330 420,350 380,370 340,350" fill="#eef2ee" stroke="#0071e3"/>
    <text x="380" y="354" text-anchor="middle" fill="#0071e3" font-family="Inter, sans-serif" font-size="11">HITL</text>
    <text x="296" y="400" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">Risk gate · Learning</text>
    <text x="296" y="434" fill="#86868b" font-family="Inter, sans-serif" font-size="13">A2A structured outputs</text>
    <text x="296" y="456" fill="#86868b" font-family="Inter, sans-serif" font-size="13">Commander discovers Registry</text>
  </g>

  <g>
    <rect x="580" y="110" width="240" height="250" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="596" y="142" fill="#c93400" font-family="IBM Plex Mono, monospace" font-size="12">3 SECURITY</text>
    <text x="596" y="180" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">Identity per agent</text>
    <text x="596" y="202" fill="#86868b" font-family="Inter, sans-serif" font-size="13">Gateway before tools</text>
    <text x="596" y="224" fill="#86868b" font-family="Inter, sans-serif" font-size="13">Model Armor · SDP</text>
    <polygon points="700,250 740,270 700,290 660,270" fill="#fef2f2" stroke="#c93400"/>
    <text x="700" y="274" text-anchor="middle" fill="#c93400" font-family="Inter, sans-serif" font-size="11">DENY</text>
    <text x="596" y="320" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="13">failOpen = false</text>
  </g>

  <g>
    <rect x="580" y="380" width="240" height="250" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="596" y="412" fill="#248a3d" font-family="IBM Plex Mono, monospace" font-size="12">4 TOOLS</text>
    <text x="596" y="450" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">GitHub · BigQuery</text>
    <text x="596" y="472" fill="#86868b" font-family="Inter, sans-serif" font-size="13">Calendar · Gmail draft</text>
    <text x="596" y="494" fill="#86868b" font-family="Inter, sans-serif" font-size="13">Flags · CI · Drive</text>
    <text x="596" y="516" fill="#86868b" font-family="Inter, sans-serif" font-size="13">Voice media-bridge</text>
  </g>

  <g>
    <rect x="840" y="110" width="320" height="520" rx="12" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="856" y="142" fill="#0071e3" font-family="IBM Plex Mono, monospace" font-size="12">5 MEMORY / CONTROL</text>
    <text x="856" y="180" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">Cloud Run runtime</text>
    <text x="856" y="214" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">Memory Bank</text>
    <text x="856" y="236" fill="#86868b" font-family="Inter, sans-serif" font-size="13">customer · product</text>
    <text x="856" y="258" fill="#86868b" font-family="Inter, sans-serif" font-size="13">engineering · organizational</text>
    <text x="856" y="300" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">Registry · Sessions</text>
    <text x="856" y="334" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">OpenTelemetry traces</text>
    <text x="856" y="380" fill="#86868b" font-family="Inter, sans-serif" font-size="13">UI: multi-room chat</text>
    <text x="856" y="402" fill="#86868b" font-family="Inter, sans-serif" font-size="13">pixel agents in each room</text>
    <text x="856" y="460" fill="#1d1d1f" font-family="Inter, sans-serif" font-size="14">Fixtures ? product shape</text>
    <text x="856" y="482" fill="#86868b" font-family="Inter, sans-serif" font-size="13">Safari / 3DS is one eval</text>
  </g>
</svg>
